name = "fastberry-portal"
main = "backend/worker.js"
compatibility_date = "2026-10-24"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fastberry-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "fastberry-receipts"
