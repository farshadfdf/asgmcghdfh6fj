name = "fastberry"
main = "src/worker.js"
compatibility_date = "2026-10-25"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "fastberry-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "fastberry-receipts"
